[build-system]
requires = ["setuptools>=61.0.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "eigsep_data"
dynamic = ["version"]
requires-python = ">=3.11"
authors = [
    {name = "Christian Hellum Bye", email = "chbye@berkeley.edu"},
]
description = "EIGSEP data analysis"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "h5py",
    "healpy",
    "jax",
    "jax-healpy",
    "matplotlib",
    "numpy",
    "pandas<3",
    # hpm.py uses scipy.special.sph_harm_y, added in 1.15
    "scipy>=1.15",
    "eigsep_base",
    # beam_mapping.{diagnostics,rfi} read corr files through
    # eigsep_observing.io, and tests/conftest.py writes its fixtures with
    # it. Imported lazily in src/, at module scope in the tests.
    "eigsep_observing",
    "healjax>=0.2.3",
    "hera_filters @ git+https://github.com/HERA-Team/hera_filters.git@main",
]

# eigsep_base and eigsep_observing are not on PyPI. Until they are,
# install them from the sibling checkouts with:
#     pip install -e ../eigsep_base -e ../eigsep_observing
# then `pip install -e .` here. CI installs them from GitHub instead --
# see .github/workflows/ci.yml, which uses `uv pip install` so these
# path sources are ignored.
#
# Field setup: the eigsep stack comes from local editable checkouts so
# code can be updated on-site without network access. uv applies these
# sources to direct dependencies only; picohost, eigsep-vna and
# eigsep_redis arrive through eigsep_observing, so install those
# editable from their own checkouts first.
[tool.uv.sources]
eigsep_base = { path = "../eigsep_base", editable = true }
# On PyPI; the sibling checkout is used for local development (non-editable).
healjax = { path = "../healjax" }
eigsep_observing = { path = "../eigsep_observing", editable = true }

[project.scripts]
eigsep-quicklook = "eigsep_data.quicklook:main"
eigsep-rfi-v3 = "eigsep_data.rfi_run:main"
eigsep-rfi-v3-beta = "eigsep_data.rfi_run:main"  # old name, kept
eigsep-select-files = "eigsep_data.select_files:main"
eigsep-build-masks = "eigsep_data.flagging.build_masks:main"
eigsep-publish-geometry-release = "eigsep_data.geometry_release:main"

[project.optional-dependencies]
vis = [
    "jupyterlab",
    "jupyterlab-vim",
    "ipympl",
    # browse.StateBrowser's controls; imported lazily, so the module
    # itself works without it.
    "ipywidgets",
]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "flake8",
    "pre-commit",
    "nbstripout",
    # test_browse builds StateBrowser with controls=True and patches
    # IPython.display, so these are test requirements, not just `vis`.
    "ipywidgets",
    "ipython",
]

# s11.py is the only consumer of the VNA driver, and it is on its way
# out to eigsep_cal (refactor/s11-moves-to-eigsep-cal). Kept as an extra
# so the module still works on main without making a VNA driver a hard
# dependency of every install. Resolved from PyPI: the ../cmt_vna path
# source the old declaration used does not exist on this machine.
s11 = [
    "eigsep-vna",
]
# Archived upstream (github.com/EIGSEP/eigsep_corr). Nothing in src/
# imports it — only the deployment-1/2/3 notebooks, which predate
# eigsep_observing.io and still do `from eigsep_corr import io, gain_cal`.
# Install .[legacy] only to re-run those. Deliberately NOT in `all`, so a
# routine dev setup doesn't pull an archived package.
legacy = [
    "eigsep_corr",
]
all = ["eigsep_data[vis, dev]"]

[project.urls]
Repository = "https://github.com/EIGSEP/data-analysis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "eigsep_data.__version__"}

[tool.pytest.ini_options]
pythonpath = ["tests"]

[tool.black]
line-length = 79
